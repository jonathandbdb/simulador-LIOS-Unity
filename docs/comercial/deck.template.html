<style>
  :root{
    --bg:#0e1218; --panel:#161c25; --panel2:#1d2531; --line:#2a3342;

  *{box-sizing:border-box;margin:0;padding:0}

  }
  body[data-lang="zh"]{

  }

  /* ---------- chrome ---------- */
  #bar{
    position:fixed; top:0; left:0; right:0; height:46px; z-index:50;
    display:flex; align-items:center; gap:14px; padding:0 20px;
    background:linear-gradient(180deg,rgba(14,18,24,.95),rgba(14,18,24,0));
  }
  #bar .brand{font-size:15px; letter-spacing:.06em; color:var(--muted)}
  #bar .brand b{color:var(--text); font-weight:600}
  #bar .sp{flex:1}
  .langs{display:flex; gap:6px}
  .langs button{
    background:var(--panel2); color:var(--muted); border:1px solid var(--line);
    border-radius:6px; padding:5px 13px; cursor:pointer; font-size:13px; font-family:inherit;
    transition:all .15s;
  }
  .langs button:hover{color:var(--text); border-color:var(--steel)}
  .langs button.active{background:var(--accent); color:#06121c; font-weight:600; border-color:var(--accent)}
  #count{color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; min-width:52px; text-align:right}

  #nav{position:fixed; bottom:0; left:0; right:0; height:52px; z-index:50;
       display:flex; align-items:center; justify-content:center; gap:10px; pointer-events:none}
  #nav button{
    pointer-events:auto; background:var(--panel2); color:var(--muted); border:1px solid var(--line);
    border-radius:6px; width:38px; height:30px; cursor:pointer; font-size:14px; font-family:inherit;
  }
  #nav button:hover{color:var(--text); border-color:var(--steel)}

  /* ---------- slide shell ---------- */
  #deck{position:relative; width:100%; height:100%}
  .slide{
    position:absolute; inset:0; display:none;
    padding:72px 7vw 64px; flex-direction:column; justify-content:center;
    font-size:calc(9px + 0.62vw);
  }
  .slide.active{display:flex}
  .slide .foot{
    position:absolute; left:7vw; right:7vw; bottom:20px;
    font-size:.72em; color:var(--dim); display:flex; justify-content:space-between; gap:20px;
  }
  .kicker{
    color:var(--accent); font-size:.85em; letter-spacing:.14em; text-transform:uppercase;
    font-weight:600; margin-bottom:.7em;
  }
  h1{font-size:2.9em; line-height:1.12; font-weight:600; letter-spacing:-.01em}
  h2{font-size:2.05em; line-height:1.18; font-weight:600; letter-spacing:-.01em; margin-bottom:.5em}
  .lead{font-size:1.18em; color:var(--muted); line-height:1.55; max-width:44em; margin-bottom:1.1em}
  p{line-height:1.6}
  .wordmark{font-size:3.5em; letter-spacing:.01em; line-height:1}
  .wordmark b{font-weight:700} .wordmark span{font-weight:300; color:var(--accent2)}

  ul{list-style:none}
  li{position:relative; padding-left:1.25em; margin:.55em 0; line-height:1.55; color:var(--muted)}
  li::before{content:""; position:absolute; left:0; top:.62em; width:.42em; height:.42em;
             border-radius:50%; background:var(--accent)}
  li b,li strong{color:var(--text); font-weight:600}

  .note{
    margin-top:1.2em; padding:.75em 1.1em; border-left:3px solid var(--accent);
    background:var(--panel); border-radius:0 6px 6px 0; font-size:.92em; color:var(--muted); line-height:1.55;
  }
  .note.warn{border-left-color:var(--warn)}
  .note b{color:var(--text)}

  .cards{display:grid; gap:1.1em; margin-top:.4em}
  .cards.c2{grid-template-columns:repeat(2,1fr)}
  .cards.c3{grid-template-columns:repeat(3,1fr)}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:1.1em 1.2em}
  .card h3{font-size:1.02em; font-weight:600; margin-bottom:.45em; color:var(--text)}
  .card p{font-size:.9em; color:var(--muted); line-height:1.55}
  .card .n{color:var(--accent); font-size:.8em; font-weight:700; letter-spacing:.1em; display:block; margin-bottom:.35em}

  .steps{display:grid; grid-template-columns:auto 1fr; gap:1.4em 1.4em; align-items:start; margin-top:.6em}
  .stepnum{
    font-size:2.6em; font-weight:700; color:var(--accent); line-height:.9;
    font-variant-numeric:tabular-nums; opacity:.85;
  }
  .stepbody h3{font-size:1.35em; font-weight:600; margin-bottom:.3em}
  .stepbody p{color:var(--muted); font-size:.98em}

  .adv{display:grid; grid-template-columns:repeat(3,1fr); gap:1em; margin-top:.5em}
  .adv div{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:1em 1.05em}
  .adv .n{color:var(--accent); font-weight:700; font-size:.8em; letter-spacing:.1em; display:block; margin-bottom:.3em}
  .adv h3{font-size:.98em; font-weight:600; line-height:1.35}

  .logo{width:7.5em; height:auto; display:block; margin-bottom:1.4em}
  .rule{height:2px; background:linear-gradient(90deg,var(--accent),transparent); margin:1.3em 0 1.1em; max-width:22em}
  .tagline{color:var(--muted); font-size:1.15em; line-height:1.55; max-width:32em}
  .badge{
    display:inline-block; margin-top:1.6em; padding:.5em 1.05em; border:1px solid var(--line);
    border-radius:20px; font-size:.86em; color:var(--muted); background:var(--panel);
  }
  .badge b{color:var(--accent2); font-weight:600}

  .legal{background:var(--panel); border:1px solid var(--line); border-radius:10px;
         padding:1.3em 1.5em; font-size:1.02em; line-height:1.62; color:var(--muted)}
  .legal b{color:var(--text)}
  .limits{margin-top:1.1em}
  .limits li::before{background:var(--steel)}
  .limits li{font-size:.9em}

  .close-title{font-size:2.4em; font-weight:600; line-height:1.2; max-width:16em}

  /* ---------- print / PDF ---------- */
  /* 338 x 190 mm ≈ 16:9 — una diapositiva por página */
  @page{size:338mm 190mm; margin:0}
  @media print{
    html,body{overflow:visible; height:auto; background:var(--bg)}
    #bar,#nav{display:none !important}
    #deck{height:auto}
    .slide{
      display:flex !important; position:relative; inset:auto;
      width:100%; height:100vh; page-break-after:always; break-after:page;
      background:var(--bg); font-size:17px; padding:56px 60px 48px;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .slide .foot{left:60px; right:60px}
    .slide:last-child{page-break-after:auto; break-after:auto}
  }
</style>

const bullets = a => `<ul>${a.map(b=>`<li>${b}</li>`).join("")}</ul>`;
const figs    = a => `<div class="figs">${a.map(f=>
  `<figure class="fig"><img src="${IMG[f.img]}" alt=""><figcaption>${f.cap}</figcaption></figure>`).join("")}</div>`;
const cards   = (a,n) => `<div class="cards c${n}">${a.map(c=>
  `<div class="card">${c.n?`<span class="n">${c.n}</span>`:""}<h3>${c.h}</h3><p>${c.p}</p></div>`).join("")}</div>`;

const SLIDES = [
  t => `<div>
      <img class="logo" src="${IMG.logo}" alt="">
      <div class="wordmark"><b>IOL</b><span>SIMULATOR</span></div>
      <div class="rule"></div>
      <h1 style="font-size:2.3em">${t.cover.title}</h1>
      <p class="tagline" style="margin-top:.9em">${t.cover.tagline}</p>
      <div class="badge">${t.cover.badge}</div>
    </div>`,

  t => `<div>
      <div class="kicker">${t.problem.kicker}</div>
      <h2>${t.problem.title}</h2>
      <p class="lead">${t.problem.lead}</p>
      ${bullets(t.problem.bullets)}
    </div>`,

  t => `<div>
      <div class="kicker">${t.what.kicker}</div>
      <h2>${t.what.title}</h2>
      <p class="lead">${t.what.lead}</p>
      ${cards(t.what.cards,2)}
    </div>`,

  t => `<div>
      <div class="kicker">${t.usage.kicker}</div>
      <h2>${t.usage.title}</h2>
      <p class="lead">${t.usage.lead}</p>
      <div class="steps">
        ${t.usage.steps.map((s,i)=>
          `<div class="stepnum">${i+1}</div>
           <div class="stepbody"><h3>${s.h}</h3><p>${s.p}</p></div>`).join("")}
      </div>
      <div class="note">${t.usage.note}</div>
    </div>`,

  t => `<div>
      <div class="kicker">${t.advIndex.kicker}</div>
      <h2>${t.advIndex.title}</h2>
      <div class="adv">${t.advIndex.items.map(i=>
        `<div><span class="n">${i.n}</span><h3>${i.h}</h3></div>`).join("")}</div>
    </div>`,

  t => `<div>
      <div class="kicker">${t.scope.kicker}</div>
      <h2>${t.scope.title}</h2>
      <div class="legal">${t.scope.legal}</div>
      <div class="limits">
        <p style="color:var(--text);font-weight:600;margin-bottom:.3em">${t.scope.limitsTitle}</p>
        ${bullets(t.scope.limits)}
      </div>
    </div>`,

  t => `<div>
      <img class="logo" src="${IMG.logo}" alt="" style="width:5.5em">
      <h2 class="close-title">${t.closing.title}</h2>
      <div class="rule"></div>
      <p class="tagline">${t.closing.lead}</p>
      <div class="badge">${t.closing.badge}</div>
    </div>`,
];

/* ============================================================ runtime */
let lang = "es", idx = 0;
const deck = document.getElementById("deck");
const countEl = document.getElementById("count");

function render(){
  const t = C[lang];
  document.body.dataset.lang = lang;
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
  deck.innerHTML = SLIDES.map((fn,i)=>
    `<section class="slide${i===idx?" active":""}">
       ${fn(t)}
       <div class="foot"><span>${t.footer}</span><span>${i+1} / ${SLIDES.length}</span></div>
     </section>`).join("");
  countEl.textContent = `${idx+1} / ${SLIDES.length}`;
  document.querySelectorAll(".langs button").forEach(b=>
    b.classList.toggle("active", b.dataset.lang===lang));
  document.getElementById("prev").title = t.nav.prev;
  document.getElementById("next").title = t.nav.next;
}
function go(n){ idx = Math.max(0, Math.min(SLIDES.length-1, n)); render(); }

document.getElementById("prev").onclick = () => go(idx-1);
document.getElementById("next").onclick = () => go(idx+1);
document.querySelectorAll(".langs button").forEach(b =>
  b.onclick = () => { lang = b.dataset.lang; render(); });

addEventListener("keydown", e => {
  if (e.key==="ArrowRight" || e.key==="PageDown" || e.key===" ") { e.preventDefault(); go(idx+1); }
  else if (e.key==="ArrowLeft" || e.key==="PageUp") { e.preventDefault(); go(idx-1); }
  else if (e.key==="Home") go(0);
  else if (e.key==="End") go(SLIDES.length-1);
});
deck.onclick = e => { if (!e.target.closest("a")) go(idx+1); };

render();
</script>
</body>
</html>
