[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# La URL real se inyecta en runtime desde app.config.settings (ver
# alembic/env.py); este valor solo importa para invocar el CLI de alembic a
# mano fuera del wrapper de app.migrations.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
